apiVersion: v1
kind: Service
metadata:
  name: postgres-dba-mcp
  namespace: kubero-mcp
  labels:
    app.kubernetes.io/name: postgres-dba-mcp
spec:
  # ClusterIP only — never publicly exposed. The kubero server reaches it via a
  # k8s port-forward over the workload cluster's apiserver (the kubeconfig it
  # already holds), so no ingress / NodePort is needed.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres-dba-mcp
  ports:
  - name: http
    port: 3010
    targetPort: http
    protocol: TCP
